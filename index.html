<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viral Outlier Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo-dot"></div>
    <div>
      <h1>Viral Outlier Radar</h1>
      <p class="sub" id="meta-line">Loading…</p>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 4.9 14.3l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0 0 10 2z"/></svg>
    <input id="q" type="search" placeholder="Search creators, captions, topics…  ( / )" autocomplete="off">
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button data-tab="all" class="active">All outliers <span class="pill" id="c-all"></span></button>
  <button data-tab="tiktok">TikTok <span class="pill" id="c-tiktok"></span></button>
  <button data-tab="instagram">Instagram <span class="pill" id="c-instagram"></span></button>
  <button data-tab="saved">★ Saved <span class="pill" id="c-saved"></span></button>
</nav>

<section class="controls" id="controls">
  <div class="chips" id="size-chips">
    <button data-size="" class="chip on">All accounts</button>
    <button data-size="small" class="chip">Under 50k followers</button>
    <button data-size="big" class="chip">Big accounts (10x+)</button>
  </div>
  <div class="right-controls">
    <label class="toggle"><input type="checkbox" id="hide-used"> Hide used</label>
    <select id="sort" aria-label="Sort">
      <option value="rank">Sort: Rank</option>
      <option value="x">Biggest outlier</option>
      <option value="metric">Most views / likes</option>
      <option value="followers">Smallest account</option>
      <option value="posted">Newest first</option>
      <option value="length_s">Shortest first</option>
    </select>
    <div class="seg" id="view-seg">
      <button data-view="cards" class="on" title="Card view">▦</button>
      <button data-view="list" title="Compact list">☰</button>
    </div>
  </div>
</section>

<div class="topics" id="topics"></div>
<p class="hint" id="hint"></p>
<main id="main"></main>
<div class="empty" id="empty" hidden>Nothing matches. Try clearing the search or filters.</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
